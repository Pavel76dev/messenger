# LiveKit Server — локальный / VPS контур для мессенджера
# Запуск: docker compose -f docker/livekit/docker-compose.yml up -d
#
# Ключи должны совпадать с LIVEKIT_API_KEY / LIVEKIT_API_SECRET в .env

port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  use_external_ip: false

keys:
  APImessengerdevkey: messenger_livekit_secret_change_me_32b

logging:
  level: info
