services:
  livekit:
    image: livekit/livekit-server:v1.8.4
    command: --config /etc/livekit.yaml --node-ip 127.0.0.1
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      # Должен совпадать с rtc.port_range_* в livekit.yaml (избегаем Hyper-V excluded ports)
      - "52000-52100:52000-52100/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  # TURN для клиентов за NAT / мобильным LTE (опционально для локальной LAN)
  # Раскомментируйте и пропишите external-ip при деплое на VPS.
